[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerlab"
version = "0.1.0"
description = "Offline 2-9 player No-Limit Hold'em AI simulation lab built on PokerKit"
requires-python = ">=3.11"
dependencies = [
    "pokerkit>=0.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pokerlab = "pokerlab.cli:main"

[tool.setuptools.packages.find]
include = ["pokerlab*"]

[tool.setuptools.package-data]
"pokerlab.agents" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::UserWarning"]
