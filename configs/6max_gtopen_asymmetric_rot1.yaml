# Position sensitivity (Test E): the same six stacks moved one seat (each stack goes to the next position).
# Generate:  python -m pokerlab strategies generate --config configs/6max_gtopen_asymmetric_rot1.yaml
# Simulate:  python -m pokerlab simulate --config configs/6max_gtopen_asymmetric_rot1.yaml --hands 10000
name: 6max_gtopen_asymmetric_rot1
game:
  variant: no_limit_texas_holdem
  max_players: 6
  active_players: 6
  small_blind_bb: 0.5
  big_blind_bb: 1.0
  ante_bb: 0
  chips_per_bb: 5000        # integer chips: 1 chip = $0.01 at $25/$50
  starting_stacks_bb: {UTG: 200, HJ: 100, CO: 150, BTN: 70, SB: 115, BB: 40}

rake:
  percentage: 0.045
  cap_bb: 0.06              # $3 per hand
  no_flop_no_drop: true
  cap_basis: players_dealt_in

strategy:
  model: approximate_equilibrium
  opponent_specific_exploitation: false
  preflop_solver: gtopen    # ../gtopen-asymmetric (private fork with per-seat stacks)
  realtime_solving: false

abstraction:                # GTOpen Preflop Lab settings (sizes in bb)
  name: gtopen-6max-v1
  open_raises: [2.5]
  sb_open_raises: [3.0]
  raise_mults: [3.0]        # every re-raise: 3x the bet faced
  max_raises: 3
  add_allin: true
  allin_threshold: 0.5
  limp: false
  realization: balanced
  multiway_equity_model: coupled_deck_v1

solve:
  iterations: 400
  eval_every: 50            # exact best-response gaps every 50 iterations
  workers: 10               # solver threads

simulation:
  hands: 10000
  seed: 42
  lineup:
    - {type: Experimental, id: Hero}
    - {type: TAG}
    - {type: LAG}
    - {type: CallingStation}
    - {type: Nit}
    - {type: Balanced}
